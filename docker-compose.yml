# Pinned so the stack keeps its identity regardless of what the checkout
# directory is called: the project name prefixes the volume (faketoken_pgdata),
# and letting it follow the folder would silently start on an empty database.
name: faketoken

services:
  postgres:
    image: postgres:18-alpine
    container_name: faketoken-postgres
    # `always` rather than `unless-stopped`: the difference only shows up
    # across a reboot. unless-stopped remembers a manual `compose stop` and
    # leaves the container down on the next daemon start, so a stack stopped
    # before shutdown never comes back on its own. `always` starts it anyway.
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-faketoken}
      # No default: the role is a superuser, and a default is public by
      # definition. Read only when the volume is first initialised; changing it
      # later also takes an ALTER ROLE inside the database.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-faketoken}
      # The role the server and the backups connect as. Created with the
      # volume by the init script mounted below; an existing volume runs that
      # script once by hand (see README).
      APP_DB_USER: ${APP_DB_USER:-faketoken_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    # Loopback only. The port is for tools on the host (psql, make run);
    # containers reach the database over the compose network, and nothing on
    # the LAN has any business with it.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Postgres 18 images expect the mount one level above PGDATA so that
      # future pg_upgrade --link runs stay inside a single mount point.
      - pgdata:/var/lib/postgresql
      - ./scripts/pg-init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-faketoken} -d ${POSTGRES_DB:-faketoken}
      interval: 5s
      timeout: 5s
      retries: 20

  # Throwaway instance for the integration suite, which drops and recreates the
  # public schema on every harness. Kept as a separate container on its own
  # port with tmpfs storage: nothing durable can land here, and a mistyped
  # TEST_DATABASE_URL cannot reach the deployment data next door. Behind the
  # "test" profile so `docker compose up -d` never starts it in production.
  postgres-test:
    image: postgres:18-alpine
    container_name: faketoken-postgres-test
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-faketoken}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: faketoken_test
      # The suite connects as the same unprivileged role the server does, so a
      # migration that needs a superuser fails here first.
      APP_DB_USER: ${APP_DB_USER:-faketoken_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    ports:
      - "127.0.0.1:${TEST_POSTGRES_PORT:-5434}:5432"
    # cluster_name is the marker newHarness reads back to confirm which
    # instance it reached — a database name alone can be recreated anywhere,
    # including on the deployment cluster. The rest trades crash safety for
    # speed, which a tmpfs cluster has given up regardless.
    command:
      - postgres
      - -c
      - cluster_name=faketoken-test
      - -c
      - fsync=off
      - -c
      - full_page_writes=off
      - -c
      - synchronous_commit=off
    tmpfs:
      - /var/lib/postgresql
    volumes:
      - ./scripts/pg-init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-faketoken} -d faketoken_test
      interval: 2s
      timeout: 5s
      retries: 30

  server:
    build: .
    container_name: faketoken
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LISTEN: ":3200"
      # Escaped line breaks: a double-quoted scalar folds them away, so the
      # value is still one unbroken URL.
      DATABASE_URL: "postgres://${APP_DB_USER:-faketoken_app}:\
        ${APP_DB_PASSWORD}@postgres:5432/\
        ${POSTGRES_DB:-faketoken}?sslmode=disable"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      INIT_ADMIN_USER: ${INIT_ADMIN_USER:-admin}
      # Read only while the database has no users; the server refuses to
      # create the first administrator without one of at least 12 characters.
      INIT_ADMIN_PASS: ${INIT_ADMIN_PASS:-}
      ALLOW_REGISTER: ${ALLOW_REGISTER:-false}
      RELAY_TIMEOUT: ${RELAY_TIMEOUT:-10m}
      MAX_RETRIES: ${MAX_RETRIES:-3}
      BILLING_UNPRICED_POLICY: ${BILLING_UNPRICED_POLICY:-reject}
      BILLING_FALLBACK_INPUT_PRICE: ${BILLING_FALLBACK_INPUT_PRICE:-0}
      BILLING_FALLBACK_OUTPUT_PRICE: ${BILLING_FALLBACK_OUTPUT_PRICE:-0}
      BILLING_FALLBACK_CACHED_PRICE: ${BILLING_FALLBACK_CACHED_PRICE:-0}
      BILLING_FALLBACK_PER_REQUEST_PRICE:
        ${BILLING_FALLBACK_PER_REQUEST_PRICE:-0}
      MODELS_DEV_URL: ${MODELS_DEV_URL:-https://models.dev/api.json}
      WEB_DIR: /app/web
      # The daily keepalive windows are read in this zone, not UTC. Without it
      # the process runs in UTC and a channel set to 03:00 opens at 11:00 for an
      # operator in +08 — same convention as BACKUP_AT below.
      TZ: ${TZ:-Asia/Singapore}
      # Blank or unset falls back to the claim compiled into the binary.
      ARA_CLAIM: ${ARA_CLAIM:-}
    ports:
      - "${SERVER_PORT:-3200}:3200"
    # Lets a channel target a service the host publishes on its own ports
    # (including other compose stacks), e.g. http://host.docker.internal:3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3200/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Nightly pg_dump of the deployment database, kept in the stack rather than a
  # host cron so it starts, stops and moves with everything else, and so the
  # dump always runs with a client matching the server version.
  backup:
    image: postgres:18-alpine
    container_name: faketoken-backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    # Runs as the host user so the dumps stay readable and prunable from
    # outside the container, which is where a restore is actually driven from.
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    environment:
      PGHOST: postgres
      # The owner of every table dumps them all; no superuser needed.
      PGUSER: ${APP_DB_USER:-faketoken_app}
      PGPASSWORD: ${APP_DB_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-faketoken}
      # BACKUP_AT is read in this zone, not UTC.
      TZ: ${TZ:-Asia/Singapore}
      BACKUP_DIR: /backup
      BACKUP_AT: ${BACKUP_AT:-05:00}
      BACKUP_KEEP: ${BACKUP_KEEP:-10}
      BACKUP_EXCLUDE_DATA: ${BACKUP_EXCLUDE_DATA:-request_log_details body_chunks}
    volumes:
      - ./scripts/pg-backup.sh:/usr/local/bin/pg-backup.sh:ro
      - ${BACKUP_DIR:-./.backup}:/backup
    entrypoint: ["/usr/local/bin/pg-backup.sh"]

volumes:
  pgdata:
