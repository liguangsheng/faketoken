<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    A token: a hollow square with a gem set into it. Drawn on a 32-unit grid
    with every edge on an even coordinate, so the 16px and 32px rasters a
    browser actually shows are pixel-aligned.
    The gem is one unit larger than the hole on every side on purpose: its
    points sit on the frame, which is what makes it read as "set in".
  -->
  <defs>
    <linearGradient id="bg" x1="4" y1="3" x2="28" y2="29" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f46e5" />
      <stop offset="1" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)" />
  <path fill="#fff" fill-rule="evenodd" d="M6 6h20v20H6zm4 4v12h12V10z" />
  <path fill="#a7f3d0" d="M16 9l7 7-7 7-7-7z" />
</svg>
